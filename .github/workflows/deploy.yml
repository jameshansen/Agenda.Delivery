# ─────────────────────────────────────────────────────────────
# Deploy — build Docker image, push to registry, deploy on VPS
# ─────────────────────────────────────────────────────────────
# Requires the following GitHub secrets:
#   SSH_HOST          — VPS IP or hostname
#   SSH_USER          — SSH user (e.g. deploy)
#   SSH_PRIVATE_KEY   — private key for SSH access
#   POSTGRES_PASSWORD — production DB password
#   AUTH_SECRET       — Auth.js secret (npx auth secret)
#   AUTH_GOOGLE_ID    — Google OAuth client ID
#   AUTH_GOOGLE_SECRET — Google OAuth client secret
#   OLLAMA_BASE_URL   — Ollama cloud endpoint (optional)
#   OLLAMA_API_KEY    — Ollama cloud API key (optional)
# ─────────────────────────────────────────────────────────────

name: Deploy

on:
  push:
    branches: [main]
  workflow_dispatch:

env:
  NEXT_TELEMETRY_DISABLED: 1

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment: production

    steps:
      - uses: actions/checkout@v4

      - name: Build Docker image
        run: |
          docker build -t agenda-delivery:${{ github.sha }} .

      - name: Save image as tar
        run: docker save agenda-delivery:${{ github.sha }} | gzip > agenda.tar.gz

      - name: Copy image to server
        uses: appleboy/scp-action@v0.1.7
        with:
          host: ${{ secrets.SSH_HOST }}
          username: ${{ secrets.SSH_USER }}
          key: ${{ secrets.SSH_PRIVATE_KEY }}
          source: agenda.tar.gz
          target: /tmp/

      - name: Copy compose + nginx files to server
        uses: appleboy/scp-action@v0.1.7
        with:
          host: ${{ secrets.SSH_HOST }}
          username: ${{ secrets.SSH_USER }}
          key: ${{ secrets.SSH_PRIVATE_KEY }}
          source: "docker-compose.prod.yml,nginx/,Dockerfile,.env.example"
          target: /opt/agenda-delivery/

      - name: Load image and deploy
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.SSH_HOST }}
          username: ${{ secrets.SSH_USER }}
          key: ${{ secrets.SSH_PRIVATE_KEY }}
          script: |
            cd /opt/agenda-delivery

            # Load the new image
            docker load < /tmp/agenda.tar.gz
            rm /tmp/agenda.tar.gz

            # Tag as latest
            docker tag agenda-delivery:${{ github.sha }} agenda-delivery:latest

            # Create .env from secrets if it doesn't exist
            cat > .env << 'EOF'
            POSTGRES_PASSWORD=${{ secrets.POSTGRES_PASSWORD }}
            AUTH_SECRET=${{ secrets.AUTH_SECRET }}
            AUTH_GOOGLE_ID=${{ secrets.AUTH_GOOGLE_ID }}
            AUTH_GOOGLE_SECRET=${{ secrets.AUTH_GOOGLE_SECRET }}
            OLLAMA_BASE_URL=${{ secrets.OLLAMA_BASE_URL }}
            OLLAMA_API_KEY=${{ secrets.OLLAMA_API_KEY }}
            AGENT_MODEL=glm-5.2
            SUMMARY_MODEL=gemma4:31b
            NEXTAUTH_URL=https://agenda.delivery
            NGINX_PORT=80
            EOF

            # Run migrations
            docker compose -f docker-compose.prod.yml run --rm app \
              npx drizzle-kit migrate

            # Deploy
            docker compose -f docker-compose.prod.yml up -d

            # Clean up old images
            docker image prune -f --filter "dangling=true"

      - name: Health check
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.SSH_HOST }}
          username: ${{ secrets.SSH_USER }}
          key: ${{ secrets.SSH_PRIVATE_KEY }}
          script: |
            sleep 5
            curl -sf http://localhost/ | head -5 || echo "Health check failed"
# ─────────────────────────────────────────────────────────────
# agenda.delivery — server block
# ─────────────────────────────────────────────────────────────

server {
    listen 80;
    server_name _;

    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    add_header Permissions-Policy "camera=(), microphone=(), geolocation=()" always;

    client_max_body_size 10m;

    # Live agent-event stream — proxied to the orchestrator's SSE relay.
    # /orchestrator/events -> orchestrator:8000/events
    location = /orchestrator/events {
        proxy_pass http://agenda_orchestrator/events$is_args$args;
        proxy_http_version 1.1;
        proxy_set_header Connection "";
        proxy_buffering off;
        proxy_cache off;
        proxy_read_timeout 3600s;
        proxy_send_timeout 3600s;
        chunked_transfer_encoding on;
        add_header X-Accel-Buffering no;
        limit_req zone=sse burst=10 nodelay;
    }

    # Orchestrator control API (/trigger, /status, /health).
    # /orchestrator/foo -> orchestrator:8000/foo
    location /orchestrator/ {
        proxy_pass http://agenda_orchestrator/;
        proxy_http_version 1.1;
        proxy_set_header Connection "";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        limit_req zone=api burst=20 nodelay;
    }

    # Next.js static assets — long cache.
    location /_next/static/ {
        proxy_pass http://agenda_ui;
        proxy_cache_valid 200 365d;
        add_header Cache-Control "public, max-age=31536000, immutable";
    }

    location ~* \.(svg|ico|png|jpg|jpeg|gif|webp|woff|woff2|ttf|otf)$ {
        proxy_pass http://agenda_ui;
        expires 30d;
        add_header Cache-Control "public, max-age=2592000";
    }

    # Everything else -> the Next.js UI.
    location / {
        proxy_pass http://agenda_ui;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_redirect off;
        limit_req zone=general burst=50 nodelay;
    }
}

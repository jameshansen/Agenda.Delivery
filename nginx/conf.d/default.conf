# ─────────────────────────────────────────────────────────────
# agenda.delivery — server block
# ─────────────────────────────────────────────────────────────

server {
    listen 80;
    server_name _;

    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    add_header Permissions-Policy "camera=(), microphone=(), geolocation=()" always;

    client_max_body_size 10m;

    # Variables, not the bare hostname, in proxy_pass -- this is what
    # actually triggers nginx to use the `resolver` directive (nginx.conf)
    # for re-resolution instead of resolving once at config load and
    # caching the IP for the process lifetime.
    set $ui_upstream http://ui:3000;
    set $orchestrator_upstream http://orchestrator:8000;

    # Live agent-event stream — proxied to the orchestrator's SSE relay.
    # /orchestrator/events -> orchestrator:8000/events
    location = /orchestrator/events {
        proxy_pass $orchestrator_upstream/events$is_args$args;
        proxy_http_version 1.1;
        proxy_set_header Connection "";
        proxy_buffering off;
        proxy_cache off;
        proxy_read_timeout 3600s;
        proxy_send_timeout 3600s;
        chunked_transfer_encoding on;
        add_header X-Accel-Buffering no;
        limit_req zone=sse burst=10 nodelay;
    }

    # Orchestrator control API (/trigger, /status, /health).
    # /orchestrator/foo -> orchestrator:8000/foo
    location /orchestrator/ {
        # A variable in proxy_pass (required for dynamic re-resolution, see
        # nginx.conf) disables nginx's usual automatic prefix-stripping --
        # strip /orchestrator/ ourselves before proxying, or every request
        # forwards as e.g. orchestrator:8000/orchestrator/status (404).
        rewrite ^/orchestrator/(.*)$ /$1 break;
        proxy_pass $orchestrator_upstream;
        proxy_http_version 1.1;
        proxy_set_header Connection "";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        limit_req zone=api burst=20 nodelay;
    }

    # Next.js static assets — long cache.
    location /_next/static/ {
        proxy_pass $ui_upstream;
        proxy_cache_valid 200 365d;
        add_header Cache-Control "public, max-age=31536000, immutable";
    }

    location ~* \.(svg|ico|png|jpg|jpeg|gif|webp|woff|woff2|ttf|otf)$ {
        proxy_pass $ui_upstream;
        expires 30d;
        add_header Cache-Control "public, max-age=2592000";
    }

    # Everything else -> the Next.js UI.
    location / {
        proxy_pass $ui_upstream;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_redirect off;
        limit_req zone=general burst=50 nodelay;
    }
}

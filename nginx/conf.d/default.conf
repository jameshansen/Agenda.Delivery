# ─────────────────────────────────────────────────────────────
# agenda.delivery — server block
# ─────────────────────────────────────────────────────────────

server {
    listen 80;
    server_name _;

    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    add_header Permissions-Policy "camera=(), microphone=(), geolocation=()" always;

    client_max_body_size 10m;

    # Variables, not the bare hostname, in proxy_pass -- this is what
    # actually triggers nginx to use the `resolver` directive (nginx.conf)
    # for re-resolution instead of resolving once at config load and
    # caching the IP for the process lifetime.
    set $ui_upstream http://ui:3000;

    # The orchestrator is not public: the UI reaches it server-side at
    # orchestrator:8000 (live events through /api/agents/events), and admins
    # trigger runs through /api/agents/run or docker exec.
    location /orchestrator/ {
        return 404;
    }

    # Next.js static assets — long cache.
    location /_next/static/ {
        proxy_pass $ui_upstream;
        proxy_cache_valid 200 365d;
        add_header Cache-Control "public, max-age=31536000, immutable";
    }

    location ~* \.(svg|ico|png|jpg|jpeg|gif|webp|woff|woff2|ttf|otf)$ {
        proxy_pass $ui_upstream;
        expires 30d;
        add_header Cache-Control "public, max-age=2592000";
    }

    # Everything else -> the Next.js UI.
    location / {
        proxy_pass $ui_upstream;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_redirect off;
        limit_req zone=general burst=50 nodelay;
    }
}

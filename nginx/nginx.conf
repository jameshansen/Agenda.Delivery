# ─────────────────────────────────────────────────────────────
# nginx — public entry point for agenda.delivery
# Routes to: ui (Next.js) and orchestrator (Python). Agents are
# internal-only; the orchestrator reaches them over the docker network.
# ─────────────────────────────────────────────────────────────

worker_processes auto;
error_log /var/log/nginx/error.log warn;
pid /var/run/nginx.pid;

events {
    worker_connections 1024;
}

http {
    include /etc/nginx/mime.types;
    default_type application/octet-stream;

    log_format main '$remote_addr - $remote_user [$time_local] '
                    '"$request" $status $body_bytes_sent '
                    '"$http_referer" "$http_user_agent" rt=$request_time';
    access_log /var/log/nginx/access.log main;

    sendfile on;
    tcp_nopush on;
    tcp_nodelay on;
    keepalive_timeout 65;
    types_hash_max_size 2048;
    server_tokens off;

    gzip on;
    gzip_vary on;
    gzip_proxied any;
    gzip_comp_level 6;
    gzip_types text/plain text/css text/xml application/json application/javascript
               application/xml application/xml+rss text/javascript image/svg+xml;

    limit_req_zone $binary_remote_addr zone=api:10m rate=30r/s;
    limit_req_zone $binary_remote_addr zone=general:10m rate=30r/s;
    limit_req_zone $binary_remote_addr zone=sse:10m rate=5r/s;

    upstream agenda_ui {
        server ui:3000;
        keepalive 32;
    }
    upstream agenda_orchestrator {
        server orchestrator:8000;
        keepalive 8;
    }

    include /etc/nginx/conf.d/*.conf;
}

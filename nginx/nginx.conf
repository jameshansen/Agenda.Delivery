# ─────────────────────────────────────────────────────────────
# nginx — public entry point for agenda.delivery
# Routes to: ui (Next.js) and orchestrator (Python). Agents are
# internal-only; the orchestrator reaches them over the docker network.
# ─────────────────────────────────────────────────────────────

worker_processes auto;
error_log /var/log/nginx/error.log warn;
pid /var/run/nginx.pid;

events {
    worker_connections 1024;
}

http {
    include /etc/nginx/mime.types;
    default_type application/octet-stream;

    log_format main '$remote_addr - $remote_user [$time_local] '
                    '"$request" $status $body_bytes_sent '
                    '"$http_referer" "$http_user_agent" rt=$request_time';
    access_log /var/log/nginx/access.log main;

    sendfile on;
    tcp_nopush on;
    tcp_nodelay on;
    keepalive_timeout 65;
    types_hash_max_size 2048;
    server_tokens off;

    gzip on;
    gzip_vary on;
    gzip_proxied any;
    gzip_comp_level 6;
    gzip_types text/plain text/css text/xml application/json application/javascript
               application/xml application/xml+rss text/javascript image/svg+xml;

    limit_req_zone $binary_remote_addr zone=api:10m rate=30r/s;
    limit_req_zone $binary_remote_addr zone=general:10m rate=30r/s;
    limit_req_zone $binary_remote_addr zone=sse:10m rate=5r/s;

    # Docker's embedded DNS (127.0.0.11), short TTL: `upstream` blocks
    # resolve container IPs ONCE at nginx startup and cache forever (no
    # native re-resolution in open-source nginx). Any container recreation
    # (`docker compose up -d ui`, a rebuild, a crash-restart) changes the
    # container's IP, and every request 502s with "connection refused"
    # until nginx itself is restarted. Found live: rebuilding `ui` mid-
    # session broke the site until `docker restart agenda-nginx`. Using a
    # resolver + a variable in proxy_pass (conf.d/default.conf) forces
    # nginx to re-resolve on each request per the TTL below instead.
    resolver 127.0.0.11 valid=10s;

    include /etc/nginx/conf.d/*.conf;
}

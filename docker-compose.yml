# ─────────────────────────────────────────────────────────────
# agenda.delivery — one-command deploy.
#   docker compose up --build
# Brings up: nginx, ui, orchestrator, 7 agent containers, redis, postgres,
# and the test council.
# ─────────────────────────────────────────────────────────────

x-agent-env: &agent-env
  DATABASE_URL: postgresql://agenda:${POSTGRES_PASSWORD:-agenda}@postgres:5432/agenda
  REDIS_URL: redis://redis:6379/0
  OLLAMA_BASE_URL: ${OLLAMA_BASE_URL:-}
  OLLAMA_API_KEY: ${OLLAMA_API_KEY:-}
  AGENT_MODEL: ${AGENT_MODEL:-glm-5.3-flash}
  SUMMARY_MODEL: ${SUMMARY_MODEL:-gemma4:31b}
  RENDERER_URL: http://renderer:8000
  BASE_URL: ${BASE_URL:-https://agenda.delivery}

x-agent-build: &agent-build
  context: ./agents
  dockerfile: Dockerfile

x-agent-common: &agent-common
  restart: unless-stopped
  depends_on:
    postgres:
      condition: service_healthy
    redis:
      condition: service_started
  networks: [agenda-net]

services:
  postgres:
    image: postgres:16-alpine
    container_name: agenda-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: agenda
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-agenda}
      POSTGRES_DB: agenda
    volumes:
      - agenda-pgdata:/var/lib/postgresql/data
      # schema.sql + seed.sql run alphabetically on first init.
      - ./db:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U agenda"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks: [agenda-net]

  # Postgres runs db/schema.sql only when the database is first created.
  # This applies it to the existing database on every full `up`, so a schema
  # change ships with the code; the file is written to be re-run (CI applies
  # it twice). An `up --no-deps <service>` deploy skips it.
  schema:
    image: postgres:16-alpine
    restart: "no"
    environment:
      PGPASSWORD: ${POSTGRES_PASSWORD:-agenda}
      PGOPTIONS: "-c client_min_messages=warning"
    volumes:
      - ./db:/db:ro
    command: ["psql", "-h", "postgres", "-U", "agenda", "-d", "agenda",
              "-v", "ON_ERROR_STOP=1", "-q", "-f", "/db/schema.sql"]
    depends_on:
      postgres:
        condition: service_healthy
    networks: [agenda-net]

  redis:
    image: redis:7-alpine
    container_name: agenda-redis
    restart: unless-stopped
    command: ["redis-server", "--appendonly", "yes"]
    volumes:
      - agenda-redisdata:/data
    networks: [agenda-net]

  orchestrator:
    build:
      context: .
      dockerfile: orchestrator/Dockerfile
    container_name: agenda-orchestrator
    restart: unless-stopped
    environment:
      <<: *agent-env
      CHECK_INTERVAL_SECS: ${CHECK_INTERVAL_SECS:-21600}
      SPIDER_INTERVAL_SECS: ${SPIDER_INTERVAL_SECS:-3600}
      ESCALATION_INTERVAL_SECS: ${ESCALATION_INTERVAL_SECS:-900}
      ADMIN_EMAIL: ${ADMIN_EMAIL:-jameshansen.bc@gmail.com}
      # notify.py emails subscribers via the host Postfix relay (Discord/webhook
      # pushes don't need this). "mailhost" maps to the host gateway below.
      SMTP_HOST: ${SMTP_HOST:-mailhost}
      SMTP_PORT: ${SMTP_PORT:-25}
      MAIL_FROM: ${MAIL_FROM:-agenda.delivery <update@agenda.delivery>}
      SMS_ENABLED: ${SMS_ENABLED:-false}
    extra_hosts:
      - "mailhost:host-gateway"
    depends_on:
      postgres:
        condition: service_healthy
      schema:
        condition: service_completed_successfully
      redis:
        condition: service_started
    networks: [agenda-net]

  # ── Headless renderer (Playwright/Chromium) for JS-heavy sites ──
  renderer:
    build:
      context: ./renderer
    container_name: agenda-renderer
    restart: unless-stopped
    shm_size: "1gb"
    networks: [agenda-net]

  # ── Undetected browser (Selenium + undetected-chromedriver) ──
  # The Scraper Agent drives this to LEARN how to reach each council's
  # latest agenda (Claude-for-Chrome-style toolset). Heavy; used at setup
  # + repair, not on every recurring check.
  browser:
    build:
      context: ./browser
    container_name: agenda-browser
    restart: unless-stopped
    shm_size: "2gb"
    environment:
      BROWSER_URL: http://browser:8000
    networks: [agenda-net]

  # ── Agents (Python + Gunicorn, one container each) ──
  spider:
    <<: *agent-common
    build: { <<: *agent-build, args: { AGENT: spider } }
    environment: *agent-env
    volumes:
      # The council registry — editable without a rebuild (admin panel, Task 2).
      - ./sources.toml:/app/sources.toml:ro

  scraper:
    <<: *agent-common
    build: { <<: *agent-build, args: { AGENT: scraper } }
    environment: *agent-env

  checking:
    <<: *agent-common
    build: { <<: *agent-build, args: { AGENT: checking } }
    environment: *agent-env

  categorization:
    <<: *agent-common
    build: { <<: *agent-build, args: { AGENT: categorization } }
    environment: *agent-env

  summary:
    <<: *agent-common
    build: { <<: *agent-build, args: { AGENT: summary } }
    environment: *agent-env

  keyword:
    <<: *agent-common
    build: { <<: *agent-build, args: { AGENT: keyword } }
    environment: *agent-env

  # Watches the other agents (and the site) and mails the admin when
  # something needs a human. Needs the SMTP relay, unlike its siblings.
  escalation:
    <<: *agent-common
    build: { <<: *agent-build, args: { AGENT: escalation } }
    environment:
      <<: *agent-env
      ADMIN_EMAIL: ${ADMIN_EMAIL:-jameshansen.bc@gmail.com}
      SMTP_HOST: ${SMTP_HOST:-mailhost}
      SMTP_PORT: ${SMTP_PORT:-25}
      MAIL_FROM: ${MAIL_FROM:-agenda.delivery <update@agenda.delivery>}
    extra_hosts:
      - "mailhost:host-gateway"

  # ── Test council: a pretend council the agents watch (see TESTING.md) ──
  # The host's Caddy serves testcouncil.agenda.delivery from the loopback port.
  # It reaches Postgres only so a revert can drop agenda.delivery's record of
  # the meeting it takes down.
  testcouncil:
    build:
      context: .
      dockerfile: testcouncil/Dockerfile
    container_name: agenda-testcouncil
    restart: unless-stopped
    environment:
      <<: *agent-env
      TESTCOUNCIL_TOKEN: ${TESTCOUNCIL_TOKEN:-}
      TESTCOUNCIL_RELEASE_DAYS: ${TESTCOUNCIL_RELEASE_DAYS:-7}
    ports:
      - "127.0.0.1:${TESTCOUNCIL_PORT:-8083}:8000"
    volumes:
      - agenda-testcouncil:/data
    depends_on:
      postgres:
        condition: service_healthy
    networks: [agenda-net]

  # ── UI (Next.js, read-only DB reader) ──
  ui:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: agenda-ui
    restart: unless-stopped
    environment:
      DATABASE_URL: postgresql://agenda:${POSTGRES_PASSWORD:-agenda}@postgres:5432/agenda
      AUTH_SECRET: ${AUTH_SECRET:-dev-secret-change-me}
      AUTH_GOOGLE_ID: ${AUTH_GOOGLE_ID:-}
      AUTH_GOOGLE_SECRET: ${AUTH_GOOGLE_SECRET:-}
      # OTP emails relay through the host Postfix; "mailhost" = host gateway below.
      SMTP_HOST: ${SMTP_HOST:-mailhost}
      SMTP_PORT: ${SMTP_PORT:-25}
      MAIL_FROM: ${MAIL_FROM:-agenda.delivery <update@agenda.delivery>}
      # "Generate from AI" in the mailing-list template editor calls Ollama
      # directly from the UI container -- the agents are module-scoped and
      # have nothing to do with a user drafting a template.
      OLLAMA_BASE_URL: ${OLLAMA_BASE_URL:-}
      OLLAMA_API_KEY: ${OLLAMA_API_KEY:-}
      AGENT_MODEL: ${AGENT_MODEL:-glm-5.3-flash}
      # UI reaches the orchestrator for manual triggers (server-side only).
      ORCHESTRATOR_URL: http://orchestrator:8000
      NODE_ENV: production
      NEXTAUTH_URL: ${NEXTAUTH_URL:-http://localhost}
      # Comma-separated account emails allowed into /admin and /api/agents/run.
      ADMIN_EMAILS: ${ADMIN_EMAILS:-jameshansen.bc@gmail.com}
    extra_hosts:
      - "mailhost:host-gateway"
    depends_on:
      postgres:
        condition: service_healthy
      schema:
        condition: service_completed_successfully
    networks: [agenda-net]

  nginx:
    image: nginx:alpine
    container_name: agenda-nginx
    restart: unless-stopped
    ports:
      - "${NGINX_PORT:-80}:80"
    volumes:
      - ./nginx/nginx.conf:/etc/nginx/nginx.conf:ro
      - ./nginx/conf.d:/etc/nginx/conf.d:ro
    depends_on: [ui, orchestrator]
    networks: [agenda-net]

volumes:
  agenda-pgdata:
  agenda-redisdata:
  agenda-testcouncil:

networks:
  agenda-net:
    driver: bridge

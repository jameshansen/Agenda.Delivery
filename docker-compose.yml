# Local dev Postgres. Prod DB is provisioned separately (Phase 7).
services:
  db:
    image: postgres:16-alpine
    container_name: agenda-db
    restart: unless-stopped
    environment:
      POSTGRES_USER: agenda
      POSTGRES_PASSWORD: agenda
      POSTGRES_DB: agenda
    ports:
      - "5432:5432"
    volumes:
      - agenda-pgdata:/var/lib/postgresql/data

volumes:
  agenda-pgdata:

# ─────────────────────────────────────────────────────────────
# Production docker-compose for agenda.delivery
# App + Postgres + nginx reverse proxy
# ─────────────────────────────────────────────────────────────

services:
  app:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: agenda-app
    restart: unless-stopped
    environment:
      # Postgres — use the internal service name
      DATABASE_URL: postgresql://agenda:${POSTGRES_PASSWORD:-agenda}@db:5432/agenda
      # Auth
      AUTH_SECRET: ${AUTH_SECRET:?AUTH_SECRET is required}
      AUTH_GOOGLE_ID: ${AUTH_GOOGLE_ID:-}
      AUTH_GOOGLE_SECRET: ${AUTH_GOOGLE_SECRET:-}
      # Ollama cloud LLM
      OLLAMA_BASE_URL: ${OLLAMA_BASE_URL:-}
      OLLAMA_API_KEY: ${OLLAMA_API_KEY:-}
      AGENT_MODEL: ${AGENT_MODEL:-glm-5.2}
      SUMMARY_MODEL: ${SUMMARY_MODEL:-gemma4:31b}
      # Next.js
      NODE_ENV: production
      NEXTAUTH_URL: ${NEXTAUTH_URL:-http://localhost}
    depends_on:
      db:
        condition: service_healthy
    expose:
      - "3000"
    networks:
      - agenda-net

  db:
    image: postgres:16-alpine
    container_name: agenda-db
    restart: unless-stopped
    environment:
      POSTGRES_USER: agenda
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-agenda}
      POSTGRES_DB: agenda
    volumes:
      - agenda-pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U agenda"]
      interval: 10s
      timeout: 5s
      retries: 5
    expose:
      - "5432"
    networks:
      - agenda-net

  nginx:
    image: nginx:alpine
    container_name: agenda-nginx
    restart: unless-stopped
    ports:
      - "${NGINX_PORT:-80}:80"
    volumes:
      - ./nginx/nginx.conf:/etc/nginx/nginx.conf:ro
      - ./nginx/conf.d:/etc/nginx/conf.d:ro
    depends_on:
      - app
    networks:
      - agenda-net

volumes:
  agenda-pgdata:

networks:
  agenda-net:
    driver: bridge
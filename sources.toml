# agenda.delivery — Council Source Registry
#
# This file is the single source of truth for the list of councils,
# committees, and organizations that agenda.delivery monitors.
#
# The Spider Agent downloads this file at startup and whenever it
# changes (checked via ETag / Last-Modified).  Each source becomes
# a spider_candidate in the queue.
#
# Format: TOML array of tables.  Each [[source]] entry has:
#   name        — official name of the council / body
#   url         — website root (the spider will crawl from here)
#   region      — human-readable location ("City, State/Province")
#   country     — ISO 3166-1 alpha-2 code (CA, US, …)
#
# To add a council, append a [[source]] block.  The file is public
# and version-controlled — anyone can submit a PR to add their council.
#
# ── Primary registries (authoritative, machine-readable) ──
#
#   Canada  — Statistics Canada, Census Subdivisions
#             https://www150.statcan.gc.ca/n1/pub/92-195-x/92-195-x2021001-eng.htm
#
#   USA     — US Census Bureau, Incorporated Places
#             https://www.census.gov/data/tables/2023/demo/popest/2023-cities-and-towns-totals.html
#
# The hand-curated entries below were derived from those public
# registries.  Over time the spider will replace them with live
# data pulled directly from the registry APIs.

